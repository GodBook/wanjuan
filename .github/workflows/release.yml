name: Signed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (for example 0.1.1)'
        required: true
      code:
        description: 'Increasing version code (for example 101)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CODE: ${{ inputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release inputs
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_CODE" =~ ^[1-9][0-9]*$ ]]
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/wanjuan.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=wanjuan\nkeyPassword=%s\n' "$RUNNER_TEMP/wanjuan.p12" "$KEY_PASSWORD" "$KEY_PASSWORD" > signing.properties
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease -PappVersionCode="$RELEASE_CODE" -PappVersionName="$RELEASE_VERSION"
      - name: Create update manifest
        shell: python
        run: |
          import os, pathlib, hashlib, json, shutil
          version = os.environ['RELEASE_VERSION']
          output = pathlib.Path('release'); output.mkdir()
          apk = output / f'wanjuan-{version}.apk'
          shutil.copyfile('app/build/outputs/apk/release/app-release.apk', apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = dict(packageName='io.github.godbook.wanjuan', versionName=version, versionCode=int(os.environ['RELEASE_CODE']), apkUrl=f'https://github.com/GodBook/wanjuan/releases/download/v{version}/{apk.name}', sha256=digest, notes=f'万卷 {version}')
          (output / 'update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (output / 'SHA256SUMS.txt').write_text(f'{digest}  {apk.name}\n', encoding='utf-8')
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$RELEASE_VERSION" release/* --title "万卷 $RELEASE_VERSION" --generate-notes --target "$GITHUB_SHA"
      - name: Clean signing material
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/wanjuan.p12"
